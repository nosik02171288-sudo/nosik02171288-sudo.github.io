<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Готовые пешеходные маршруты в телефоне по городам России. Скачайте экскурсию в телефон и гуляйте без гида.">
<title>Экскурсии в телефоне. Маршруты по городам</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<style>
:root{
  --bg:#f2f0fb;--card:#ffffff;--tx:#2e2a4d;--mut:#7a7699;
  --acc:#7c4dff;--acc2:#ff4d9d;--acc3:#00c2ff;--ok:#00c9a7;--line:#e6e2f5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16.5px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;
  background:
    radial-gradient(40% 35% at 20% 25%,rgba(124,77,255,.14),transparent 70%),
    radial-gradient(35% 30% at 80% 20%,rgba(255,77,157,.11),transparent 70%),
    radial-gradient(45% 40% at 65% 80%,rgba(0,194,255,.11),transparent 70%),
    radial-gradient(35% 35% at 30% 85%,rgba(255,196,77,.1),transparent 70%);
  z-index:0;pointer-events:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ===== Шапка с навигацией ===== */
header{position:sticky;top:0;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);z-index:50;animation:slideDown .5s ease-out both}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:16px}
.logo{font-weight:800;text-decoration:none;font-size:19px;letter-spacing:-.02em;color:var(--tx);white-space:nowrap}
.nav{display:flex;gap:22px}
.nav a{color:var(--mut);text-decoration:none;font-weight:700;font-size:14.5px;transition:color .2s}
.nav a:hover{color:var(--acc)}
.btn{position:relative;overflow:hidden;padding:13px 26px;border-radius:100px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;text-decoration:none;
  font-weight:800;font-size:15px;display:inline-block;border:0;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(124,77,255,.28);transition:transform .25s ease,box-shadow .25s}
.btn::after{content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transition:left .45s ease}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(255,77,157,.35)}
.btn:hover::after{left:150%}
.btn:active{transform:scale(.95)}
.btn.alt{background:#fff;border:2px solid var(--acc);color:#000;box-shadow:0 6px 18px rgba(46,42,77,.12)}
.btn.alt:hover{box-shadow:0 12px 28px rgba(124,77,255,.25)}

/* ===== Hero: две колонки ===== */
.hero{padding:70px 0 56px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
h1{font-size:clamp(34px,5.5vw,56px);line-height:1.08;letter-spacing:-.03em;font-weight:900;animation:fadeUp .7s ease-out both}
h1 span{background:linear-gradient(100deg,var(--acc),var(--acc2),var(--acc3),var(--acc));
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradFlow 8s linear infinite}
@keyframes gradFlow{from{background-position:0% 50%}to{background-position:250% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-kicker{display:inline-block;background:linear-gradient(90deg,rgba(124,77,255,.12),rgba(255,77,157,.12));
  color:var(--acc);font-weight:800;font-size:13.5px;padding:6px 16px;border-radius:100px;margin-bottom:16px;animation:fadeUp .7s ease-out both}
.hero p{color:var(--mut);margin:18px 0 28px;font-size:16.5px;animation:fadeUp .7s .15s ease-out both}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;animation:fadeUp .7s .28s ease-out both}
.hero-stats{display:flex;gap:28px;margin-top:32px;animation:fadeUp .7s .4s ease-out both}
.hstat b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hstat span{font-size:13px;color:var(--mut)}

/* декоративная стопка карточек справа */
.stack{position:relative;height:340px;animation:fadeUp .7s .3s ease-out both}
.stack .mini{position:absolute;width:78%;background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 30px rgba(46,42,77,.12);padding:14px 16px;font-weight:800}
.stack .mini small{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:3px}
.stack .m1{top:6%;left:6%;transform:rotate(-5deg)}
.stack .m2{top:34%;left:20%;transform:rotate(3deg)}
.stack .m3{top:63%;left:2%;transform:rotate(-2deg)}
.stack .mini .bar{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:10px}

section{padding:56px 0}
h2{font-size:30px;text-align:center;letter-spacing:-.02em;font-weight:900}
.sub{text-align:center;color:var(--mut);margin:8px auto 36px;font-size:16px;max-width:640px}

/* ===== Как это работает ===== */
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;position:relative;animation:fadeUp .6s ease-out backwards}
.step:nth-child(2){animation-delay:.12s}.step:nth-child(3){animation-delay:.24s}
.step .n{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;color:#fff;margin-bottom:14px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px rgba(124,77,255,.3)}
.step h3{font-size:18px;margin-bottom:6px}
.step p{color:var(--mut);font-size:14.5px}

/* ===== Города: широкие строки ===== */
.rows{display:flex;flex-direction:column;gap:16px}
.card{display:flex;align-items:stretch;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:22px;overflow:hidden;cursor:pointer;color:var(--tx);font-family:inherit;padding:0;
  box-shadow:0 6px 18px rgba(46,42,77,.07);transition:transform .3s ease,box-shadow
