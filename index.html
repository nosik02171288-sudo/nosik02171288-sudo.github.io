const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const mTitle = document.getElementById('mTitle');
const mMeta = document.getElementById('mMeta');
const mList = document.getElementById('mList');

const SHOW_FIRST = 6;

function cardHTML(r, i, hidden){
  const cheapest = r.variants.reduce(function(a,b){ return a.points <= b.points ? a : b; });
  return '<button class="card' + (hidden ? ' hidden' : '') + '" data-i="' + i + '">' +
    '<div class="art" style="background:' + r.grad + '">' + r.name + '</div>' +
    '<div class="body">' +
      '<div class="tags">' + r.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
      '<p>' + r.short + '</p>' +
      '<div class="foot"><span class="price">' + r.variants.length + ' маршрута</span><span>от ' + cheapest.time + '</span></div>' +
    '</div>' +
  '</button>';
}

grid.innerHTML = ROUTES.map(function(r,i){ return cardHTML(r, i, i >= SHOW_FIRST); }).join('');

const moreBtn = document.getElementById('moreBtn');
const moreTxt = document.getElementById('moreTxt');
const moreCnt = document.getElementById('moreCnt');
let expanded = false;

function updateMore(){
  const hiddenCount = ROUTES.length - SHOW_FIRST;
  moreTxt.textContent = expanded ? 'Скрыть города' : 'Показать ещё города';
  moreCnt.textContent = expanded ? '' : hiddenCount;
  moreCnt.style.display = expanded ? 'none' : 'inline-block';
}

function expandCities(){
  grid.querySelectorAll('.card.hidden').forEach(function(c,k){
    c.classList.remove('hidden');
    c.classList.add('appear');
    c.style.animationDelay = (k*45) + 'ms';
  });
  expanded = true;
  updateMore();
}

function collapseCities(){
  grid.querySelectorAll('.card').forEach(function(c,i){
    if(i >= SHOW_FIRST){ c.classList.add('hidden'); c.classList.remove('appear'); c.style.animationDelay = ''; }
  });
  expanded = false;
  updateMore();
}

moreBtn.addEventListener('click', function(){
  if(expanded){
    collapseCities();
    document.getElementById('routes').scrollIntoView({behavior:'smooth'});
  } else {
    expandCities();
  }
});

document.getElementById('seeAllBtn').addEventListener('click', function(){
  if(!expanded) expandCities();
});

updateMore();

function openCity(i){
  const r = ROUTES[i];
  mTitle.textContent = r.name;
  mMeta.textContent = r.variants.length + ' варианта маршрута';
  mList.innerHTML = r.variants.map(function(v){
    const num = v.points ? v.points : '—';
    const numLbl = v.points ? 'точек' : 'под запрос';
    return '<div class="var">' +
      '<div class="var-top">' +
        '<div>' +
          '<h4>' + v.title + '</h4>' +
          '<div class="var-sub">' + v.time + ' · ' + v.price + '</div>' +
        '</div>' +
        '<div class="var-num">' + num + '<small>' + numLbl + '</small></div>' +
      '</div>' +
      '<div class="inc">' + v.includes.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>' +
      '<div class="about">' + v.about + '</div>' +
      '<div style="display:flex;gap:8px">' +
  '<a class="btn" href="https://t.me/Ggeeeeeer" style="flex:1">Заказать в Telegram</a>' +
  '<a class="btn" href="https://max.ru/u/f9LHodD0cOJy_Cv_Sq4Q0EkIPYHQ8mHcrpac-SOiPwfdPv_yPWw21J4kkuw" style="flex:1;background:rgba(255,255,255,.08);border:1px solid #2b3346">Заказать в MAX</a>' +
'</div>' +


    '</div>';
  }).join('');
  overlay.classList.add('open');
  document.body.classList.add('locked');
}

function closeCity(){
  overlay.classList.remove('open');
  document.body.classList.remove('locked');
}

grid.addEventListener('click', function(e){
  const card = e.target.closest('.card');
  if(card) openCity(+card.dataset.i);
});
document.getElementById('closeBtn').addEventListener('click', closeCity);
overlay.addEventListener('click', function(e){ if(e.target === overlay) closeCity(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeCity(); });
</script>
