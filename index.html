<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Готовые пешеходные маршруты в телефоне по городам России. Скачайте экскурсию в телефон и гуляйте без гида.">
<title>Экскурсии в телефоне. Маршруты по городам</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<style>
:root{
  --dark:#1d1b2e;
  --cream:#faf6ee;
  --paper:#ffffff;
  --ink:#2a2740;
  --mut:#6f6a85;
  --acc:#6c4df0;
  --acc2:#e8558f;
  --acc3:#2ba8d8;
  --sun:#f5b942;
  --line:#e5dfcf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  color:var(--ink);
  font:16.5px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh;overflow-x:hidden;
  /* главный фокус: перелив тёмный → светлый */
  background:linear-gradient(180deg,
    #1d1b2e 0%,
    #2c2748 14%,
    #4a3f68 30%,
    #7a6a8f 46%,
    #c4a9a0 62%,
    #ecd9c6 78%,
    #faf6ee 100%);
  background-attachment:fixed;
  background-color:var(--cream);
}

.wrap{max-width:1060px;margin:0 auto;padding:0 22px;position:relative;z-index:1}

/* ===== Шапка ===== */
header{position:sticky;top:0;background:rgba(29,27,46,.88);border-bottom:1px solid rgba(255,255,255,.12);z-index:50}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:14px}
.logo{font-weight:800;text-decoration:none;font-size:19px;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.nav{display:flex;gap:22px}
.nav a{color:rgba(255,255,255,.7);text-decoration:none;font-weight:700;font-size:14.5px;transition:color .2s}
.nav a:hover{color:var(--sun)}

/* ===== Кнопки — светлые, «бумажные» ===== */
.btn{
  position:relative;overflow:hidden;
  padding:13px 26px;border-radius:14px;
  background:var(--cream);
  color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;
  display:inline-block;border:0;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(29,27,46,.9),0 10px 22px rgba(29,27,46,.25);
  transition:transform .22s ease,box-shadow .22s;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 7px 0 rgba(29,27,46,.9),0 16px 30px rgba(29,27,46,.3)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,27,46,.9)}
/* акцентная — подсолнечная */
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #a8761a,0 10px 22px rgba(29,27,46,.3)}
.btn.sun:hover{box-shadow:0 7px 0 #a8761a,0 16px 30px rgba(29,27,46,.35)}

/* ===== Hero ===== */
.hero{color:#fff;padding:84px 0 120px;position:relative}
.hero-kicker{display:inline-block;background:rgba(245,185,66,.18);border:1px solid rgba(245,185,66,.5);
  color:var(--sun);font-weight:800;font-size:13.5px;padding:6px 18px;border-radius:100px;margin-bottom:18px}
h1{font-size:clamp(34px,5.8vw,58px);line-height:1.1;letter-spacing:-.03em;font-weight:900;animation:fadeUp .7s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero .lead{color:rgba(255,255,255,.82);max-width:640px;margin:20px 0 30px;font-size:16.5px;animation:fadeUp .7s .15s ease-out both}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;animation:fadeUp .7s .28s ease-out both}
.hero-actions .btn{box-shadow:0 4px 0 rgba(0,0,0,.55),0 10px 22px rgba(0,0,0,.35)}
.hero-actions .btn:hover{box-shadow:0 7px 0 rgba(0,0,0,.55),0 16px 30px rgba(0,0,0,.4)}
.hero-actions .btn:active{box-shadow:0 1px 0 rgba(0,0,0,.55)}

/* стикер-заметка в хиро */
.note{
  background:#ffe9a3;color:#5a4300;
  padding:16px 18px;max-width:340px;border-radius:4px;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  font-size:14.5px;line-height:1.55;transform:rotate(2.5deg);
  position:relative;animation:fadeUp .7s .4s ease-out both;
}
.note::before{ /* скотч */
  content:"";position:absolute;top:-10px;left:50%;width:80px;height:22px;
  transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,255,255,.45);box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.note b{display:block;margin-bottom:4px}
.note .sign{display:block;text-align:right;margin-top:8px;font-style:italic;opacity:.75}

.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:44px;align-items:start}
.hero-stats{display:flex;gap:30px;margin-top:34px;animation:fadeUp .7s .5s ease-out both}
.hstat b{display:block;font-size:26px;font-weight:900;color:var(--sun)}
.hstat span{font-size:13px;color:rgba(255,255,255,.7)}

/* ===== Секции в журнальном стиле ===== */
section{padding:64px 0}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.sec-num{font-size:15px;font-weight:900;color:var(--acc2);letter-spacing:.08em;white-space:nowrap}
.sec-line{flex:1;border-top:2px dashed var(--line)}
h2{font-size:30px;letter-spacing:-.02em;font-weight:900}
/* волнистое «нарисованное» подчёркивание */
.wavy{position:relative;display:inline-block}
.wavy::after{
  content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;
  background:radial-gradient(circle at 4px -2px,transparent 4px,var(--acc2) 4px,var(--acc2) 5px,transparent 5px) repeat-x;
  background-size:10px 8px;background-position:0 3px;opacity:.8;
}
.sub{color:var(--mut);margin:14px 0 36px;font-size:16px;max-width:600px}

/* ===== Карточки-«открытки»: повёрнуты, со скотчем ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{
  position:relative;display:flex;flex-direction:column;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;
  cursor:pointer;color:var(--ink);font-family:inherit;padding:0;
  box-shadow:0 2px 0 var(--line),0 14px 30px rgba(42,39,64,.12);
  transition:transform .3s ease,box-shadow .3s;
  animation:cardIn .5s ease-out backwards;
}
.card:nth-child(odd){transform:rotate(-1deg)}
.card:nth-child(even){transform:rotate(1.1deg)}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.16s}
.card:nth-child(4){animation-delay:.22s}.card:nth-child(5){animation-delay:.28s}.card:nth-child(6){animation-delay:.34s}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1}}
/* скотч сверху */
.card::before{
  content:"";position:absolute;top:-11px;left:50%;width:86px;height:24px;z-index:2;
  transform:translateX(-50%) rotate(-2deg);
  background:rgba(255,255,255,.55);
  box-shadow:0 1px 3px rgba(42,39,64,.18);
  border-left:1px dashed rgba(42,39,64,.15);border-right:1px dashed rgba(42,39,64,.15);
}
.card:hover{transform:rotate(0deg) translateY(-7px);box-shadow:0 2px 0 var(--line),0 22px 40px rgba(42,39,64,.2)}
.card:active{transform:scale(.98)}
.card .art{
  position:relative;height:140px;display:flex;align-items:flex-end;gap:10px;padding:14px;
  font-size:18px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);
  border-bottom:1px solid var(--line);background-repeat:no-repeat;
}
.card .body{padding:16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.card p{color:var(--mut);font-size:14.5px;flex:1}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px;border:1px solid var(--line);color:var(--ink);background:var(--cream);transition:background .25s,color .25s}
.card:hover .tag{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:11px;font-size:14px;color:var(--mut)}
.price{font-weight:900;font-size:15px;white-space:nowrap;color:var(--acc2)}
